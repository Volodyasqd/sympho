    <script>
        // ЛОГІКА ПОШУКУ
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query.length > 0) {
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            } else {
                alert("Будь ласка, введіть запит для пошуку");
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // ЛОГІКА ФОРМИ
        function sendMail() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const msg = document.getElementById('userMsg').value;

            if(name === "" || phone === "") {
                alert("Будь ласка, заповніть ім'я та телефон");
                return;
            }

            const myEmail = "babelskiy-bies@ukr.net";
            const subject = encodeURIComponent("Заявка з сайту Sympho");
            const body = encodeURIComponent(`Ім'я: ${name}\nТелефон: ${phone}\nПовідомлення: ${msg}`);
            
            window.location.href = `mailto:${myEmail}?subject=${subject}&body=${body}`;
        }
