<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sympho — Результати пошуку</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <header>
        <div class="container header-flex" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;">
            <a href="javascript:history.back()" class="back-link"><span>←</span> Назад</a>
            <a href="index.html" class="logo-link"><img src="logo.png" alt="Sympho" class="logo-img"></a>
            
            <nav style="display: flex; align-items: center;">
                <ul style="display: flex; list-style: none; gap: 15px; margin-right: 20px;">
                    <li><a href="index.html">Головна</a></li>
                    <li><a href="contacts.html">Контакти</a></li>
                </ul>
                <div style="position: relative; display: flex; align-items: center;">
                    <a href="cart.html" style="text-decoration: none; font-size: 24px;">🛒</a>
                    <span id="cart-count" style="
                        position: absolute; 
                        top: -8px; 
                        right: -10px; 
                        background: #ff4d4d; 
                        color: white; 
                        border-radius: 50%; 
                        padding: 2px 6px; 
                        font-size: 12px; 
                        font-weight: bold;
                        display: none;
                    ">0</span>
                </div>
            </nav>
        </div>
    </header>

    <section class="container content">
        <h1 id="searchTitle">Результати пошуку</h1>
        <div id="search-results" class="product-grid">
            </div>
    </section>

    <script src="catalog.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q')?.toLowerCase() || "";
        const resultsContainer = document.getElementById('search-results');
        
        if (query) {
            document.getElementById('searchTitle').innerText = `Пошук: "${query}"`;
            
            // РОЗШИРЕНИЙ ПОШУК: Назва + Артикул + Опис (для пошуку 6л, 10л тощо)
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.article.toLowerCase().includes(query) ||
                (p.desc && p.desc.toLowerCase().includes(query))
            );

            if (filtered.length > 0) {
                filtered.forEach(item => {
                    resultsContainer.innerHTML += `
                        <div class="product-card">
                            <img src="${item.images[0]}" alt="${item.name}" style="width:100%; height:180px; object-fit:contain;">
                            <p style="color: #888; font-size: 13px; margin: 10px 0 5px 0;">Арт: ${item.article}</p>
                            <h3 style="margin-top: 0; font-size: 18px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center;">
                                ${item.name}
                            </h3>
                            <p class="price" style="margin: 10px 0;">${item.price}</p>
                            
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <a href="product.html?id=${item.id}" class="buy-btn" style="text-decoration:none; display: block; text-align: center;">Детальніше</a>
                                <button onclick="addToCart('${item.id}')" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">
                                    🛒 У кошик
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                resultsContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                        <p style="font-size: 18px; color: #666;">Нічого не знайдено за вашим запитом.</p>
                        <a href="index.html" class="buy-btn" style="display:inline-block; margin-top:20px; text-decoration:none;">До каталогу</a>
                    </div>`;
            }
        } else {
            resultsContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">Будь ласка, введіть запит у поле пошуку.</p>`;
        }
    </script>

    <footer>
        <p style="text-align: center; padding: 20px; color: #94a3b8;">&copy; 2026 Sympho. Якість у кожній деталі.</p>
    </footer>
</body>
</html>
